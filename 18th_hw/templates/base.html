<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}სტუდენტების სისტემა{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            line-height: 1.6;
        }
        nav {
            background: #2c3e50;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .brand {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
        }
        nav a {
            color: #ecf0f1;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        nav a:hover {
            background: #34495e;
        }
        .container {
            max-width: 960px;
            margin: 32px auto;
            padding: 0 20px;
        }
        .flash {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .flash.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .flash.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        h1 {
            margin-bottom: 24px;
            color: #2c3e50;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">🎓 სტუდენტების სისტემა</div>
        <div>
            <a href="{{ url_for('index') }}">მთავარი</a>
            <a href="{{ url_for('add_student') }}">სტუდენტის დამატება</a>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer>&copy; სტუდენტების მართვის სისტემა</footer>
</body>
</html>
